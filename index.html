<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Room | Launchpad</title>
  <meta name="description" content="Reserve the Classroom, Conference Room, or Studio at the Launchpad Tech Village.">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#282420; --accent:#ff7a3d; --cream:#efeae6; --muted:#6b645d; --line:#d9d2cb; --ok:#1a7f4b; --err:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 Montserrat, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:#fff; }
    .top { background:var(--ink); color:#fff; padding:18px 16px 24px; }
    .in { max-width:560px; margin:0 auto; }
    .logo { width:170px; height:auto; display:block; margin-bottom:18px; }
    .top h1 { font-size:26px; line-height:1.15; font-weight:700; margin:0 0 6px; }
    .top .sub { margin:0; font-size:14px; color:#d9d2cb; }
    .wrap { max-width:560px; margin:0 auto; padding:8px 16px 32px; }
    label { display:block; font-weight:600; font-size:14px; margin:18px 0 6px; }
    select, input[type=date], input[type=text], input[type=email] { width:100%; padding:11px 12px; font:inherit; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
    select:focus, input:focus { outline:2px solid var(--accent); outline-offset:1px; }
    .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:6px; }
    .slot { padding:11px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font:600 14px Montserrat, sans-serif; cursor:pointer; }
    .slot:hover:not(:disabled) { border-color:var(--accent); background:#fff4ee; }
    .slot.sel { background:var(--accent); border-color:var(--accent); color:var(--ink); }
    .slot:disabled { background:var(--cream); color:#8a8178; cursor:not-allowed; font-weight:400; }
    .slot .who { display:inline-block; margin-top:2px; font-size:12px; font-weight:600; color:#6b645d; }
    button.primary { margin-top:20px; width:100%; padding:13px; font:700 16px Montserrat, sans-serif; border:0; border-radius:6px; background:var(--accent); color:var(--ink); cursor:pointer; }
    button.primary:hover:not(:disabled) { filter:brightness(.95); }
    button.primary:disabled { opacity:.5; cursor:not-allowed; }
    .msg { margin-top:16px; padding:12px 14px; border-radius:6px; font-size:14px; }
    .msg.err { background:#fef3f2; color:var(--err); }
    .msg.ok { background:#ecfdf3; color:var(--ok); }
    .hint { color:var(--muted); font-size:13px; margin-top:8px; }
    .hp { position:absolute; left:-9999px; }
    [hidden] { display:none !important; }
    #overview { margin-top:36px; border-top:1px solid var(--line); padding-top:6px; }
    #overview h2 { font-size:18px; margin:18px 0 10px; }
    .datenav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .datenav button { width:44px; height:40px; border:1px solid var(--line); border-radius:6px; background:#fff; font-size:20px; line-height:1; cursor:pointer; color:var(--ink); }
    .datenav button:disabled { opacity:.35; cursor:not-allowed; }
    #gridDate { font-weight:700; text-align:center; }
    .grid table { width:100%; border-collapse:separate; border-spacing:3px; table-layout:fixed; }
    .grid th { font-size:12px; text-align:center; font-weight:700; padding:4px 2px; line-height:1.2; }
    .grid th.t, .grid td.t { width:46px; }
    .grid td.t { font-size:11px; color:var(--muted); text-align:right; padding-right:4px; white-space:nowrap; }
    .grid td.c { height:36px; border-radius:5px; font-size:11px; text-align:center; padding:2px; line-height:1.15; overflow:hidden; word-break:break-word; }
    .grid td.open { background:#fff4ee; border:1px solid #ffd2bb; cursor:pointer; color:var(--ink); font-weight:600; }
    .grid td.open:hover, .grid td.open:focus { background:var(--accent); outline:none; }
    .grid td.booked { background:var(--cream); color:#6b645d; font-weight:600; }
    .grid td.pend { background:#fff7d6; color:#7a5d00; font-weight:600; }
    .grid td.na { background:#f7f5f3; color:#c4bbb2; }
  </style>
</head>

    <h1>Book a Room</h1>
    <p class="sub" id="hours">Loading…</p>
  </div>
</div>
<div class="wrap">
  <div id="form">
    <label for="room">Room</label>
    <select id="room"></select>

    <label for="date">Date</label>
    <input type="date" id="date">

    <label>Available times (60 minutes)</label>
    <div class="slots" id="slots"></div>
    <div class="hint" id="slotHint">Choose a room and date.</div>

    <div id="details" hidden>
      <label for="name">Your name</label>
      <input type="text" id="name" autocomplete="name" maxlength="80">
      <label for="email">Your email</label>
      <input type="email" id="email" autocomplete="email" maxlength="120">
      <div class="hp"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <button class="primary" id="book">Book this room</button>
    </div>
    <div id="msg"></div>
  </div>

  <section id="overview">
    <h2>All rooms at a glance</h2>
    <div class="datenav">
      <button type="button" id="prev" aria-label="Previous day">&lsaquo;</button>
      <span id="gridDate"></span>
      <button type="button" id="next" aria-label="Next day">&rsaquo;</button>
    </div>
    <div id="grid" class="grid">Loading…</div>
    <div class="hint">Tap an open time to book it. * = starts after 5:00pm and needs building approval.</div>
  </section>
</div>

<script>
  // The booking logic and calendars live in a Google Apps Script web app; this page only talks to it.
  var API = "https://script.google.com/macros/s/AKfycbz7SeqVjY4N9eyI0fkL5LksnRK0UYqvADAetE1WDPtNTMjh2eNpZi-xgLPvczO7mgCp/exec";
  var state = { start: null, cfg: null, pending: false, want: null };
  var grid = { date: null };
  var $ = function (id) { return document.getElementById(id); };

  function showMsg(text, kind) {
    $('msg').innerHTML = text ? '<div class="msg ' + kind + '"></div>' : '';
    if (text) $('msg').firstChild.textContent = text;
  }

  function parse(res) {
    return res.json().then(function (d) {
      if (d && d.error) throw new Error(d.error);
      return d;
    });
  }
  function apiGet(params) {
    return fetch(API + '?' + new URLSearchParams(params).toString()).then(parse);
  }
  function apiBook(body) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(parse);
  }

  function addDays(str, n) {
    var d = new Date(str + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function prettyDate(str) {
    return new Date(str + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });
  }

  function loadGrid() {
    var d = grid.date, rooms = state.cfg.rooms;
    $('gridDate').textContent = prettyDate(d);
    $('prev').disabled = d <= state.cfg.minDate;
    $('next').disabled = d >= state.cfg.maxDate;
    $('grid').textContent = 'Loading…';
    getDay(d)
      .then(function (day) {
        if (d === grid.date) renderGrid(rooms, rooms.map(function (r) { return day[r.key] || []; }), d);
      })
      .catch(function (e) { if (d === grid.date) $('grid').textContent = 'Could not load availability. ' + e.message; });
  }

  function renderGrid(rooms, all, d) {
    var rows = {};
    all.forEach(function (slots, i) {
      slots.forEach(function (s) {
        var row = rows[s.start] || (rows[s.start] = { label: s.label, cells: {} });
        row.cells[i] = s;
      });
    });
    var starts = Object.keys(rows).sort();
    var box = $('grid'); box.innerHTML = '';
    if (!starts.length) { box.textContent = 'No bookable times on this date (weekdays only, and not in the past).'; return; }
    var table = document.createElement('table');
    var head = table.insertRow();
    head.appendChild(Object.assign(document.createElement('th'), { className: 't' }));
    rooms.forEach(function (r) { var th = document.createElement('th'); th.textContent = r.name; head.appendChild(th); });
    starts.forEach(function (st) {
      var tr = table.insertRow();
      var t = tr.insertCell(); t.className = 't'; t.textContent = rows[st].label.split(' – ')[0].replace(':00', '');
      rooms.forEach(function (r, i) {
        var td = tr.insertCell(); var s = rows[st].cells[i];
        td.className = 'c';
        if (!s) { td.classList.add('na'); td.textContent = '–'; return; }
        if (s.available) {
          td.classList.add('open'); td.textContent = s.needsApproval ? 'Open *' : 'Open';
          td.tabIndex = 0; td.setAttribute('role', 'button');
          td.setAttribute('aria-label', r.name + ' ' + s.label + ' open');
          var go = function () { pickSlot(r.key, d, s.start); };
          td.onclick = go;
          td.onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } };
        } else if (/^Pending/.test(s.bookedBy || '')) {
          td.classList.add('pend'); td.textContent = (s.bookedBy || 'Pending').replace(/^Pending – /, 'Pending: ');
        } else {
          td.classList.add('booked'); td.textContent = (s.bookedBy || 'Booked').replace(/^Booked – /, '') || 'Booked';
        }
      });
    });
    box.appendChild(table);
  }

  function pickSlot(roomKey, date, start) {
    $('room').value = roomKey; $('date').value = date;
    state.want = start;
    loadSlots();
  }

  // One request returns all three rooms for a day; the slot list and the grid share it.
  var dayCache = {};
  function getDay(date) {
    var c = dayCache[date];
    if (c && Date.now() - c.t < 45000) return c.p;
    var p = apiGet({ action: 'day', date: date });
    dayCache[date] = { t: Date.now(), p: p };
    p.catch(function () { delete dayCache[date]; });
    return p;
  }

  function init(cfg) {
    state.cfg = cfg;
    $('hours').textContent = 'Open ' + cfg.hoursLabel + '. Questions? Contact ' + cfg.contact + '.';
    var sel = $('room');
    cfg.rooms.forEach(function (r) {
      var o = document.createElement('option');
      o.value = r.key; o.textContent = r.name; sel.appendChild(o);
    });
    var pre = new URLSearchParams(location.search).get('room');
    if (pre && cfg.rooms.some(function (r) { return r.key === pre; })) sel.value = pre;
    $('date').min = cfg.minDate; $('date').max = cfg.maxDate; $('date').value = cfg.minDate;
    sel.onchange = loadSlots; $('date').onchange = loadSlots;
    $('book').onclick = book;
    grid.date = cfg.minDate;
    $('prev').onclick = function () { grid.date = addDays(grid.date, -1); loadGrid(); };
    $('next').onclick = function () { grid.date = addDays(grid.date, 1); loadGrid(); };
    loadSlots();
    loadGrid();
  }

  function loadSlots() {
    state.start = null; $('details').hidden = true; showMsg('');
    var date = $('date').value;
    if (!date) return;
    $('slots').innerHTML = ''; $('slotHint').textContent = 'Loading times…';
    var room = $('room').value;
    getDay(date)
      .then(function (day) {
        if ($('date').value !== date || $('room').value !== room) return;
        renderSlots(day[room] || []);
      })
      .catch(function (e) { $('slotHint').textContent = ''; showMsg(e.message, 'err'); });
  }

  function renderSlots(slots) {
    var box = $('slots'); box.innerHTML = '';
    if (!slots.length) { state.want = null; $('slotHint').textContent = 'No bookable times on this date (weekdays only).'; return; }
    var any = false, toSelect = null;
    slots.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'slot'; b.disabled = !s.available;
      if (s.available) {
        b.textContent = s.label + (s.needsApproval ? ' *' : '');
        any = true;
      } else {
        var t = document.createElement('div'); t.textContent = s.label;
        var w = document.createElement('span'); w.className = 'who'; w.textContent = s.bookedBy || 'Booked';
        b.appendChild(t); b.appendChild(w);
      }
      b.onclick = function () {
        state.start = s.start; state.pending = s.needsApproval;
        $('book').textContent = s.needsApproval ? 'Request this room' : 'Book this room';
        Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('sel'); });
        b.classList.add('sel'); $('details').hidden = false; showMsg('');
      };
      box.appendChild(b);
      if (state.want === s.start && s.available) toSelect = b;
    });
    state.want = null;
    if (toSelect) { toSelect.click(); $('details').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    $('slotHint').textContent = any ? 'Tap a time to select it. * Times starting after 5:00pm need building approval.' : 'This room is fully booked on this date.';
  }

  function book() {
    var btn = $('book');
    if (!state.start) return showMsg('Please pick a time.', 'err');
    btn.disabled = true; btn.textContent = state.pending ? 'Requesting…' : 'Booking…'; showMsg('');
    apiBook({
      action: 'book', room: $('room').value, start: state.start,
      name: $('name').value, email: $('email').value, website: $('website').value
    }).then(function (r) {
      dayCache = {};
      loadGrid();
      $('form').innerHTML = '<div class="msg ok"></div>';
      $('form').firstChild.textContent = r.pending
        ? 'Request received for ' + r.room + ' — ' + r.when + '. Bookings after 5:00pm need building approval, so this is NOT confirmed yet. ' + state.cfg.contact + ' will follow up by email.'
        : 'You’re booked! ' + r.room + ' — ' + r.when + '. A calendar invitation is on its way to your email. To change or cancel, contact ' + state.cfg.contact + '.';
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = state.pending ? 'Request this room' : 'Book this room';
      showMsg(e.message.replace(/^Error:\s*/, ''), 'err');
      state.start = null; dayCache = {};
      loadSlots(); loadGrid();
    });
  }

  apiGet({ action: 'config' }).then(init).catch(function (e) {
    showMsg('Sorry, the booking system could not be reached. Please try again in a moment. (' + e.message + ')', 'err');
  });
</script>
</body>
</html>
