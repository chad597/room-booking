    .card p { margin:4px 0; }
    a.btn { display:inline-block; margin-top:20px; padding:12px 18px; border-radius:6px; background:var(--accent); color:var(--ink); font-weight:700; text-decoration:none; }

<script>
  var API = "https://script.google.com/macros/s/AKfycbz7SeqVjY4N9eyI0fkL5LksnRK0UYqvADAetE1WDPtNTMjh2eNpZi-xgLPvczO7mgCp/exec";
  var p = new URLSearchParams(location.search);
  var action = p.get('a');
  var out = document.getElementById('out');

  function show(kind, title, lines) {
    out.className = 'card ' + kind;
    out.innerHTML = '';
    var h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
    lines.forEach(function (t) { var q = document.createElement('p'); q.textContent = t; out.appendChild(q); });
  }

  if ((action !== 'approve' && action !== 'decline') || !p.get('room') || !p.get('id') || !p.get('t')) {
    show('err', 'Invalid link', ['This approval link is incomplete. Please use the button in the Slack message.']);
  } else {
    fetch(API + '?' + new URLSearchParams({ action: action, room: p.get('room'), id: p.get('id'), t: p.get('t') }).toString())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.error) { show('err', 'Could not complete this', [d.error]); return; }
        if (d.status === 'approved') {
          show('ok', 'Approved ✅', [d.room + ' — ' + d.when, 'Booked for ' + d.name + '. They’ve been emailed a confirmation and a calendar invitation.']);
        } else {
          show('no', 'Declined', [d.room + ' — ' + d.when, d.name + ' has been emailed, and the time is open again.']);
        }
      })
      .catch(function (e) { show('err', 'Could not reach the booking system', ['Please try again in a moment. (' + e.message + ')']); });
  }
</script>
